function anchorSave(name,data){try{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('Print ব্যবহার করুন');return false}}
async function saveFile(name,data){
 if(typeof claude==='undefined'||!claude.use)return anchorSave(name,data);
 try{const dl=await claude.use('downloads');
  if(!dl)return anchorSave(name,data);
  await dl.save({filename:name,data});return true}
 catch(e){if(e&&e.code!=='declined')toast('ডাউনলোড হয়নি: '+(e.message||e.code||''));return false}
}

let pend='',pendG=[];
function shrink(file,max=640){return new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return no('type');const r=new FileReader();r.onerror=()=>no('read');r.onload=()=>{const im=new Image();im.onerror=()=>no('img');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
async function pick(el){const fs=[...el.files].slice(0,5);if(!fs.length)return;try{const a=[];for(const f of fs)a.push(await putImg(await shrink(f)));pend=a[0];pendG=a.slice(1);const v=$('#pv');v.src=resolve(pend);v.hidden=false;toast(a.length+' টি ছবি রেডি ✅')}catch(e){toast('শুধু JPG / PNG / WebP দিন')}}
async function chImg(id,el){const f=el.files[0];if(!f)return;try{const p=D.products.find(x=>x.id===id);p.img=await putImg(await shrink(f));save();toast('ছবি আপডেট ✅');prod()}catch(e){toast('শুধু JPG / PNG / WebP দিন')}}

 $('#mb').innerHTML=`<button class="btn o s mx" onclick="closeM();prod()">✕</button><h3 style="margin-top:0">✏️ ${esc(p.n)}</h3>
 <label>বিবরণ (Description)<textarea rows="5" onchange="upP(${id},'desc',this.value.trim())">${esc(p.desc||'')}</textarea></label>
 <p><b>ছবি (প্রথমটি মেইন, সর্বোচ্চ ৫টি)</b></p><div style="display:flex;gap:10px;flex-wrap:wrap">${ims.map((u,k)=>`<div style="position:relative"><img src="${esc(u)}" alt="" style="width:80px;height:80px;border-radius:10px;object-fit:cover;display:block;border:2px solid ${k?'var(--br)':'var(--pr)'}"><button class="btn d s" style="position:absolute;top:2px;right:2px;padding:1px 6px" onclick="delImg(${id},${k})">✕</button></div>`).join('')||'<small>কোনো ছবি নেই</small>'}</div>
 ${ims.length<5?`<label class="btn s" style="display:inline-block;margin-top:12px">➕ ছবি যোগ করুন<input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="addImgs(${id},this)"></label>`:''}`;
 $('#md').classList.add('on')}

function delImg(id,k){const p=D.products.find(x=>x.id===id),a=rawImgs(p);a.splice(k,1);setImgs(p,a);detEd(id)}
async function addImgs(id,el){const p=D.products.find(x=>x.id===id),a=rawImgs(p);try{for(const f of [...el.files]){if(a.length>=5)break;a.push(await putImg(await shrink(f)))}}catch(e){toast('শুধু JPG / PNG / WebP দিন')}setImgs(p,a);detEd(id)}
function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!p)return toast('নাম ও দাম দিন');D.products.push({id:D.pid++,n,e:$('#pe').value||'📦',c:$('#pc').value,p,cost:+$('#pk').value||0,s:+$('#ps').value||0,img:pend,gal:pendG,disc:Math.min(90,Math.max(0,+$('#pd').value||0)),desc:$('#pds').value.trim()});pend='';pendG=[];save();toast('যোগ হয়েছে');prod()}
